name: Daily Wishlist Stock Tracker

on:
  schedule:
    # 6:00 PM IST = 12:30 PM UTC  (Mon–Fri, after NSE market close)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:   # allow manual trigger from Actions tab

permissions:
  contents: write    # needed to commit cache.json back to repo

concurrency:
  group: wishlist-tracker
  cancel-in-progress: false

jobs:
  send-wishlist-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run wishlist stock tracker
        env:
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WISHLIST_TELEGRAM_CHAT_IDS: ${{ secrets.WISHLIST_TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_IDS:          ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python wishlist_tracker.py

      - name: Commit updated cache back to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          if git diff --staged --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi
          git commit -m "chore: update stock data cache $(date -u '+%Y-%m-%d') [skip ci]"
          # Rebase on any concurrent change so the push never gets stuck.
          git pull --rebase=autostash origin "${GITHUB_REF_NAME:-main}"
          git push

  # ── Keep-alive: prevents GitHub disabling the schedule after 60 days ───────
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflow alive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u)" > .github/keep_alive.txt
          git add .github/keep_alive.txt
          git diff --staged --quiet || git commit -m "chore: keep workflow alive [skip ci]"
          git pull --rebase=autostash origin "${GITHUB_REF_NAME:-main}"
          git push
